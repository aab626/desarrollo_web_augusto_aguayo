{% extends 'base.html' %}
{% block title %} Estadísticas {% endblock %}

{% block main_content %}
<h2 class="section-title">Estadísticas</h2>

<div class="statistics-grid">
    <div class="stat-item">
        <h3 class="stat-title">Adopciones por día</h3>
        <img class="stat-image" src="images/statistics/adoptions_per_day.png"
            alt="Gráfico de barras: adopciones por día.">
    </div>

    <div class="stat-item">
        <h3 class="stat-title">Avisos por tipo de mascota</h3>
        <img class="stat-image" src="images/statistics/adoptions_pie.png"
            alt="Gráfico de torta: adopciones de gatos vs. perros">
    </div>

    <div class="stat-item">
        <h3 class="stat-title">Adopciones por tipo, mes a mes</h3>
        <img class="stat-image" src="images/statistics/adoptions_monthly_per_type.png"
            alt="Gráfico de barras: adopciones por mes, por tipo.">
    </div>
</div>
{% endblock %}

{% block body_scripts %}
{% endblock %}
